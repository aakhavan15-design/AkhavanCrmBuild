name: CRM UX quality
on:
  pull_request:
  push:
    branches: [main, codex/unified-ux-quality-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run quality:ux
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: RTL browser checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4198 --strictPort > /tmp/akhavan-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused http://127.0.0.1:4198/ >/dev/null
          python scripts/test-ux-browser.py --screenshots /tmp/akhavan-ux-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-browser-screenshots
          path: /tmp/akhavan-ux-screenshots
          if-no-files-found: ignore
