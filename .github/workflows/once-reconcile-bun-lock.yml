name: Reconcile TypeScript toolchain lock once
on:
  push:
    branches:
      - codex/unified-ux-quality-gate
    paths:
      - .github/workflows/once-reconcile-bun-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-ux-quality-gate
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Refresh lockfile metadata only
        run: bun install --lockfile-only
      - name: Save dependencies and remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/once-reconcile-bun-lock.yml
          git commit -m "chore(deps): lock stable AST tooling and remove one-shot repair"
          git push origin HEAD:refs/heads/codex/unified-ux-quality-gate
