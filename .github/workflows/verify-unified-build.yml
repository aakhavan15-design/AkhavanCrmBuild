name: Verify unified source build
on:
  push:
    branches: [codex/unified-ux-quality-gate]
    paths:
      - .github/workflows/verify-unified-build.yml
      - src/lib/moduleLanding.ts
      - src/lib/navigation.ts
      - src/components/ModuleLandingWorkspace.tsx
      - src/components/PlannedModulePage.tsx
      - src/components/ReportsWorkspace.tsx
      - src/components/ReportsHub.tsx
      - tests/analyticsEvidenceContracts.test.mjs
      - tests/advancedReportsAccess.test.mjs
      - src/components/ReportEnginePanels.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build
