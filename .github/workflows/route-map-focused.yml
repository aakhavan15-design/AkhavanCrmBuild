name: Route Map focused verification
on:
  push:
    branches:
      - chatgpt/parallel-checklist-20261122
      - codex/unified-ux-quality-gate
    paths:
      - 'server/routeMap*.mjs'
      - 'src/lib/routeMetricHealth.ts'
      - 'docs/CHECKLIST_FA.md'
      - 'server/erpVisitRouteReads.mjs'
      - 'server/index.mjs'
      - 'src/components/RouteMapOverview.tsx'
      - 'src/components/ErpVisitLiveReport.tsx'
      - 'src/components/GeoZoneMapEditor.tsx'
      - 'src/lib/geoRouteAnalysis.ts'
      - 'src/lib/visitIntelligence.ts'
      - 'tests/geoRouteAnalysis.test.mjs'
      - 'tests/visitIntelligence.test.mjs'
      - 'tests/routeMetricHealth.test.mjs'
      - 'tests/routeMapAnalytics.test.mjs'
      - 'tests/routeMapMoney.test.mjs'
      - 'tests/landingNavigationSourceContracts.test.mjs'
      - 'tests/analyticsEvidenceContracts.test.mjs'
      - 'tests/advancedReportsAccess.test.mjs'
      - 'tests/criticalGeoFifoContracts.test.mjs'
      - 'tests/cashFlowScenarioReconciliation.test.mjs'
      - 'tests/authLampExperienceContracts.test.mjs'
      - 'tests/personnelLoginPresentation.test.mjs'
      - 'tests/cinematicWebGLStageContracts.test.mjs'
      - 'src/components/auth/CinematicWebGLStage.tsx'
      - 'src/components/auth/LivePendantWebGL.tsx'
      - 'tests/livePendantWebGLContracts.test.mjs'
      - 'scripts/check-login-webgl.mjs'
      - 'src/components/auth/loginCinematic.css'
      - 'src/components/onboarding/ApplyPage.tsx'
      - 'src/components/onboarding/recruitmentCinematic.css'
      - 'src/lib/cashFlowEngine.ts'
      - 'src/components/LoginWorkspace.tsx'
      - 'src/components/auth/AnimatedLamp3D.tsx'
      - 'src/lib/erpRouteGeoView.ts'
      - 'src/components/finance/FifoInventoryPanel.tsx'
      - 'src/components/ReportEnginePanels.tsx'
      - 'src/components/ReportsHub.tsx'
      - 'src/lib/moduleLanding.ts'
      - 'src/lib/navigation.ts'
      - 'src/components/ModuleLandingWorkspace.tsx'
      - 'src/components/ReportsWorkspace.tsx'
      - 'src/App.tsx'
      - 'src/components/GeoIntelligenceWorkspace.tsx'
      - 'src/lib/routeMetricHealth.ts'
      - '.github/workflows/route-map-focused.yml'
  workflow_dispatch:
jobs:
  route-map-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Node syntax (no dependencies)
        run: |
          node --check server/routeMapAnalytics.mjs
          node --check server/routeMapCustomerDetail.mjs
          node --check server/erpVisitRouteReads.mjs
          node --check server/index.mjs
      - name: TSX transpile syntax (no package install)
        run: |
          bun -e "import fs from 'node:fs'; const t=new Bun.Transpiler({loader:'tsx'}); for(const p of process.argv.slice(1)){t.transformSync(fs.readFileSync(p,'utf8')); console.log('Parsed '+p)}" \
            src/components/RouteMapOverview.tsx \
            src/components/ErpVisitLiveReport.tsx \
            src/components/GeoZoneMapEditor.tsx \
            src/components/GeoIntelligenceWorkspace.tsx \
            src/components/ReportsHub.tsx \
            src/components/ReportsWorkspace.tsx \
            src/components/ReportEnginePanels.tsx \
            src/components/LoginWorkspace.tsx \
            src/components/auth/AnimatedLamp3D.tsx \
            src/components/auth/LivePendantWebGL.tsx \
            src/components/onboarding/ApplyPage.tsx
      - name: WebGL2 login shader compile and draw (headless Chrome)
        run: node scripts/check-login-webgl.mjs
      - name: Visit and geographical calculation tests
        run: bun test tests/geoRouteAnalysis.test.mjs tests/visitIntelligence.test.mjs tests/erpVisitToursContracts.test.mjs tests/routeMetricHealth.test.mjs tests/routeMapAnalytics.test.mjs tests/routeMapMoney.test.mjs tests/landingNavigationSourceContracts.test.mjs tests/analyticsEvidenceContracts.test.mjs tests/advancedReportsAccess.test.mjs tests/criticalGeoFifoContracts.test.mjs tests/cashFlowScenarioReconciliation.test.mjs tests/authLampExperienceContracts.test.mjs tests/personnelLoginPresentation.test.mjs tests/cinematicWebGLStageContracts.test.mjs tests/livePendantWebGLContracts.test.mjs
